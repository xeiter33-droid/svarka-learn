  <script>
    (function () {
      var PROJECT = "svarka-learn";
      var parts = location.pathname.split("/").filter(Boolean);
      var onGh = /(^|\.)github\.io$/i.test(location.hostname);
      if (!onGh || parts[0] !== PROJECT) return;
      if (parts.length > 1) {
        location.replace("/" + PROJECT + "/#/" + parts.slice(1).join("/") + location.search);
        return;
      }
      if (!/\/$/.test(location.pathname)) {
        location.replace("/" + PROJECT + "/" + location.hash + location.search);
      }
    })();
  </script>
